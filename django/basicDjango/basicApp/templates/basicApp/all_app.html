{% extends "layout.html" %} 

{% block title %} All Apps {% endblock %} 

{% block content %}
<h1>This is the app info page.</h1>

<div class="grid grid-cols-3 gap-4 m-4">
{% for app in apps %}
<div class="bg-blue-800 p-5 rounded">
    <img class="h-full rounded shadow-lg" src="{{app.image.url}}" alt="">
    <h3 class="text-2xl font-bold">{{app.name}}</h3>
    <a href="#">
        <button type="button"
        class="bg-orange-500">
            {{app.type}} - {{app.id}}
        </button>
    </a>
</div>
{% endfor %}
</div>

{% endblock %}
